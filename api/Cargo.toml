[package]
name = "waypoint-api"
version = "0.1.0"
edition.workspace = true
publish = false
default-run = "waypoint-api"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
getrandom = "0.3"
libc = "0.2"
pdf-extract = "~0.10.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocket = { version = "0.5.1", features = ["json"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "sync", "rt", "net"] }
utoipa = { version = "5", features = ["rocket_extras", "chrono"] }
zeroize = "1.8"

[dev-dependencies]
wiremock = "0.6"
