[package]
name = "waypoint-api"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
libc = "0.2"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
tempfile = "3"
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "sync", "rt"] }
